name: Apply Logic State Registration

on:
  push:
    branches:
      - agent/phase3-logic-state

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register module and tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          marker = 'InputMap.cppm LogicBytecode.cppm'
          replacement = 'InputMap.cppm LogicState.cppm LogicBytecode.cppm'
          if replacement not in text:
              if marker not in text:
                  raise SystemExit('module marker not found')
              text = text.replace(marker, replacement, 1)
          test_marker = 'add_executable(KairoEngineCoreTests tests/EngineCoreTests.cpp)'
          test_replacement = 'add_executable(KairoEngineCoreTests tests/EngineCoreTests.cpp tests/LogicStateTests.cpp)'
          if test_replacement not in text:
              if test_marker not in text:
                  raise SystemExit('test marker not found')
              text = text.replace(test_marker, test_replacement, 1)
          cmake.write_text(text)

          umbrella = Path('KairoEngineCore.cppm')
          text = umbrella.read_text()
          marker = 'export import Kairo.EngineCore.InputMap;\n'
          line = 'export import Kairo.EngineCore.LogicState;\n'
          if line not in text:
              if marker not in text:
                  raise SystemExit('umbrella marker not found')
              umbrella.write_text(text.replace(marker, marker + line, 1))

          Path('.github/workflows/apply-logic-state-registration.yml').unlink()
          PY
      - name: Commit registration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Register persistent logic state"
          git push
