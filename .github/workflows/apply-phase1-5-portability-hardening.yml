name: Apply Phase 1-5 portability hardening
on:
  push:
    branches: [agent/phase1-5-portability-hardening]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/phase1-5-portability-hardening
      - name: Apply portability hardening
        shell: python
        run: |
          from pathlib import Path

          p = Path('LogicState.cppm')
          s = p.read_text()
          old = '''        friend bool operator==(const LogicStateEntry&, const LogicStateEntry&) = default;'''
          new = '''        friend bool operator==(const LogicStateEntry& left, const LogicStateEntry& right)\n        {\n            if (left.Name != right.Name || left.Value.index() != right.Value.index()) return false;\n            switch (left.Value.index())\n            {\n                case 0u: return std::get<bool>(left.Value) == std::get<bool>(right.Value);\n                case 1u: return std::get<double>(left.Value) == std::get<double>(right.Value);\n                case 2u:\n                {\n                    const auto& a = std::get<kairo::foundation::math::Vec3d>(left.Value);\n                    const auto& b = std::get<kairo::foundation::math::Vec3d>(right.Value);\n                    return a.x == b.x && a.y == b.y && a.z == b.z;\n                }\n                case 3u: return std::get<Entity>(left.Value).Value == std::get<Entity>(right.Value).Value;\n                case 4u: return std::get<std::string>(left.Value) == std::get<std::string>(right.Value);\n                default: return false;\n            }\n        }'''
          if old not in s: raise SystemExit('LogicState equality pattern not found')
          p.write_text(s.replace(old, new))

          p = Path('tests/Phase3RuntimeTests.cpp')
          s = p.read_text()
          if '#include <variant>' not in s:
              s = s.replace('#include <utility>\n', '#include <utility>\n#include <variant>\n')
          p.write_text(s)

          p = Path('CMakeLists.txt')
          s = p.read_text()
          s = s.replace('    Logger.cppm CoreDiagnostics.cppm JobSystem.cppm Application.cppm KairoEngineCore.cppm)',
                        '    Platform.cppm Logger.cppm CoreDiagnostics.cppm JobSystem.cppm Application.cppm KairoEngineCore.cppm)')
          s = s.replace('        tests/RuntimeSceneCommandsTests.cpp)',
                        '        tests/RuntimeSceneCommandsTests.cpp\n        tests/PlatformTests.cpp)')
          p.write_text(s)

          p = Path('KairoEngineCore.cppm')
          s = p.read_text()
          if 'export import Kairo.EngineCore.Platform;' not in s:
              s = s.replace('export import Kairo.EngineCore.Layer;\n', 'export import Kairo.EngineCore.Layer;\nexport import Kairo.EngineCore.Platform;\n')
          p.write_text(s)

          Path('Platform.cppm').write_text(r'''module;

#include <cstdlib>
#include <filesystem>
#include <optional>
#include <string>
#include <string_view>
#include <system_error>

#if defined(_WIN32)
#include <windows.h>
#endif

export module Kairo.EngineCore.Platform;

export namespace kairo::engine::platform
{
    enum class Family { Windows, MacOS, Linux, Unknown };

    [[nodiscard]] constexpr Family CurrentFamily() noexcept
    {
    #if defined(_WIN32)
        return Family::Windows;
    #elif defined(__APPLE__)
        return Family::MacOS;
    #elif defined(__linux__)
        return Family::Linux;
    #else
        return Family::Unknown;
    #endif
    }

    [[nodiscard]] constexpr char NativePathSeparator() noexcept
    {
        return CurrentFamily() == Family::Windows ? '\\' : '/';
    }

    [[nodiscard]] constexpr std::string_view ExecutableSuffix() noexcept
    {
        return CurrentFamily() == Family::Windows ? std::string_view{".exe"} : std::string_view{};
    }

    [[nodiscard]] inline std::optional<std::string> Environment(std::string_view name)
    {
        if (name.empty()) return std::nullopt;
    #if defined(_WIN32)
        int required = 0;
        if (getenv_s(nullptr, reinterpret_cast<size_t*>(&required), std::string(name).c_str()) != 0 || required == 0)
            return std::nullopt;
        std::string value(static_cast<std::size_t>(required), '\0');
        size_t written = 0;
        if (getenv_s(&written, value.data(), value.size(), std::string(name).c_str()) != 0 || written == 0)
            return std::nullopt;
        if (!value.empty() && value.back() == '\0') value.pop_back();
        return value;
    #else
        const char* value = std::getenv(std::string(name).c_str());
        return value == nullptr ? std::nullopt : std::optional<std::string>{value};
    #endif
    }

    inline void ReplaceFile(const std::filesystem::path& source, const std::filesystem::path& destination)
    {
    #if defined(_WIN32)
        if (!::MoveFileExW(source.c_str(), destination.c_str(), MOVEFILE_REPLACE_EXISTING | MOVEFILE_WRITE_THROUGH))
            throw std::filesystem::filesystem_error("atomic file replacement failed", source, destination,
                std::error_code(static_cast<int>(::GetLastError()), std::system_category()));
    #else
        std::error_code error;
        std::filesystem::rename(source, destination, error);
        if (error) throw std::filesystem::filesystem_error("atomic file replacement failed", source, destination, error);
    #endif
    }
}
''')

          Path('tests/PlatformTests.cpp').write_text(r'''#include <filesystem>
#include <fstream>
#include <string>
#include <catch2/catch_test_macros.hpp>

import Kairo.EngineCore.Platform;

TEST_CASE("Platform reports a supported host family")
{
    using namespace kairo::engine::platform;
    CHECK(CurrentFamily() != Family::Unknown);
    CHECK((NativePathSeparator() == '/' || NativePathSeparator() == '\\'));
}

TEST_CASE("Platform file replacement has one cross-platform contract")
{
    using namespace kairo::engine::platform;
    const auto root = std::filesystem::temp_directory_path() / "kairo-platform-tests";
    std::filesystem::create_directories(root);
    const auto source = root / "source.tmp";
    const auto destination = root / "destination.txt";
    { std::ofstream out(source, std::ios::binary); out << "new"; }
    { std::ofstream out(destination, std::ios::binary); out << "old"; }
    ReplaceFile(source, destination);
    std::ifstream in(destination, std::ios::binary);
    std::string value;
    in >> value;
    CHECK(value == "new");
    CHECK_FALSE(std::filesystem::exists(source));
    std::filesystem::remove_all(root);
}
''')

          Path('.github/workflows/apply-phase1-5-portability-hardening.yml').unlink()
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add platform layer and harden module portability"
          git push
