name: Apply Phase 1 Bytecode Fix

on:
  push:
    branches:
      - agent/phase1-deterministic-bytecode

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic reader patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('LogicBytecode.cppm')
          text = path.read_text()
          old = '''        for (std::uint32_t i = 0; i < vectors; ++i) result.Vectors.push_back({
              std::bit_cast<double>(input.U64()), std::bit_cast<double>(input.U64()),
              std::bit_cast<double>(input.U64()) });
          for (std::uint32_t i = 0; i < entities; ++i) result.Entities.push_back({ input.U32() });
          for (std::uint32_t i = 0; i < instructions; ++i) result.Instructions.push_back({
              static_cast<LogicOpcode>(input.U8()), input.U32(), input.U32(), input.U32(), input.U32() });
          for (std::uint32_t i = 0; i < entries; ++i) result.Entries.push_back({
              static_cast<LogicEventKind>(input.U8()), input.String(), input.U32() });
          '''
          new = '''        for (std::uint32_t i = 0; i < vectors; ++i)
          {
              const double x = std::bit_cast<double>(input.U64());
              const double y = std::bit_cast<double>(input.U64());
              const double z = std::bit_cast<double>(input.U64());
              result.Vectors.emplace_back(x, y, z);
          }
          for (std::uint32_t i = 0; i < entities; ++i)
          {
              const std::uint32_t value = input.U32();
              result.Entities.push_back(Entity{ value });
          }
          for (std::uint32_t i = 0; i < instructions; ++i)
          {
              LogicInstruction instruction;
              instruction.Opcode = static_cast<LogicOpcode>(input.U8());
              instruction.A = input.U32();
              instruction.B = input.U32();
              instruction.C = input.U32();
              instruction.D = input.U32();
              result.Instructions.push_back(instruction);
          }
          for (std::uint32_t i = 0; i < entries; ++i)
          {
              LogicEntryPoint entry;
              entry.Event = static_cast<LogicEventKind>(input.U8());
              entry.Action = input.String();
              entry.InstructionOffset = input.U32();
              result.Entries.push_back(std::move(entry));
          }
          '''
          if old not in text:
              raise SystemExit('expected parser block not found')
          path.write_text(text.replace(old, new, 1))

          test_path = Path('tests/DeterministicBytecodeTests.cpp')
          test_path.write_text(r'''#include <catch2/catch_test_macros.hpp>
          #include <cstddef>
          #include <span>
          #include <string_view>
          #include <vector>

          import Kairo.EngineCore.Entity;
          import Kairo.EngineCore.LogicBytecode;
          import Kairo.Foundation.Math.Vector;

          namespace
          {
              class Host final : public kairo::engine::LogicHost
              {
              public:
                  kairo::foundation::math::Vec3d Position{};
                  void Print(kairo::engine::Entity, std::string_view) override {}
                  void SetEntityPosition(kairo::engine::Entity,
                      const kairo::foundation::math::Vec3d& position) override { Position = position; }
                  void ApplyEntityImpulse(kairo::engine::Entity,
                      const kairo::foundation::math::Vec3d&) override {}
              };
          }

          TEST_CASE("Logic bytecode deserializes stateful fields in wire order")
          {
              using namespace kairo::engine;
              LogicProgram program;
              program.RegisterCount = 5;
              program.Vectors.push_back({ 1.25, -2.5, 3.75 });
              program.Entities.push_back(Entity{ 42 });
              program.Instructions = {
                  { LogicOpcode::LoadEntity, 3, 0, 0, 0 },
                  { LogicOpcode::LoadVector3, 4, 0, 0, 0 },
                  { LogicOpcode::SetEntityPosition, 3, 4, 0, 0 },
                  { LogicOpcode::Halt, 0, 0, 0, 0 }
              };
              program.Entries.push_back({ LogicEventKind::BeginPlay, {}, 0 });

              const std::vector<std::byte> bytes = SerializeLogicProgram(program);
              const LogicProgram parsed = ParseLogicProgram(bytes);
              REQUIRE(parsed.Vectors.size() == 1);
              CHECK(parsed.Vectors[0].x == 1.25);
              CHECK(parsed.Vectors[0].y == -2.5);
              CHECK(parsed.Vectors[0].z == 3.75);
              REQUIRE(parsed.Instructions.size() == 4);
              CHECK(parsed.Instructions[0].Opcode == LogicOpcode::LoadEntity);
              CHECK(parsed.Instructions[0].A == 3);
              CHECK(parsed.Instructions[0].B == 0);

              Host host;
              LogicInstance instance(parsed);
              CHECK(instance.Dispatch(Entity{ 7 }, {}, host) == 4);
              CHECK(host.Position.x == 1.25);
              CHECK(host.Position.y == -2.5);
              CHECK(host.Position.z == 3.75);
          }

          TEST_CASE("Logic bytecode rejects every truncated suffix")
          {
              using namespace kairo::engine;
              LogicProgram program;
              program.RegisterCount = 3;
              program.Instructions.push_back({ LogicOpcode::Halt, 0, 0, 0, 0 });
              program.Entries.push_back({ LogicEventKind::BeginPlay, {}, 0 });
              const std::vector<std::byte> bytes = SerializeLogicProgram(program);
              for (std::size_t size = 0; size < bytes.size(); ++size)
                  CHECK_THROWS(ParseLogicProgram(std::span(bytes.data(), size)));
          }
          ''')

          cmake = Path('tests/CMakeLists.txt')
          cmake_text = cmake.read_text()
          marker = 'EngineCoreTests.cpp\n'
          if 'DeterministicBytecodeTests.cpp' not in cmake_text:
              if marker not in cmake_text:
                  raise SystemExit('test source marker not found')
              cmake.write_text(cmake_text.replace(marker, marker + '    DeterministicBytecodeTests.cpp\n', 1))

          Path('.github/workflows/apply-phase1-bytecode-fix.yml').unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make logic bytecode decoding deterministic"
          git push
