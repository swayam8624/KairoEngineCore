name: Agent Reflection V2 Test Fix

on:
  push:
    branches: [complete/reflection-v2-integration]
    paths: [.github/workflows/agent_fix_reflection_v2_tests.yml]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Update Reflection V2 tests
        shell: python
        run: |
          from pathlib import Path

          integration = Path("tests/ReflectionV2IntegrationTests.cpp")
          text = integration.read_text()
          old = "import Kairo.EngineCore;\nimport Kairo.Reflection;"
          new = "import Kairo.Assets;\nimport Kairo.Foundation.Math;\nimport Kairo.EngineCore;\nimport Kairo.Reflection;"
          if old not in text:
              raise SystemExit("integration import anchor not found")
          integration.write_text(text.replace(old, new, 1))

          core = Path("tests/EngineCoreTests.cpp")
          text = core.read_text()
          replacements = {
              "REQUIRE(registry.Size() == 8u);": "REQUIRE(registry.Size() == 9u);\n    CHECK(registry.Contains(\"Kairo.Engine.TransformComponent\"));",
              "REQUIRE(components.size() == 3u);\n    CHECK(components[0].TypeKey == \"Kairo.Engine.NameComponent\");\n    CHECK(components[1].TypeKey == \"Kairo.Engine.CameraComponent\");\n    CHECK(components[2].TypeKey == \"Kairo.Engine.LogicComponent\");": "REQUIRE(components.size() == 4u);\n    CHECK(components[0].TypeKey == \"Kairo.Engine.NameComponent\");\n    CHECK(components[1].TypeKey == \"Kairo.Engine.TransformComponent\");\n    CHECK(components[2].TypeKey == \"Kairo.Engine.CameraComponent\");\n    CHECK(components[3].TypeKey == \"Kairo.Engine.LogicComponent\");\n    CHECK(ResolveReflectedComponent(scene, entity, \"Kairo.Engine.TransformComponent\") == &scene.Transform(entity));"
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"EngineCoreTests anchor not found: {old[:48]}")
              text = text.replace(old, new, 1)
          core.write_text(text)

          rendering = Path("tests/RenderingComponentTests.cpp")
          text = rendering.read_text()
          for old, new in [
              ('registry.Require("Kairo.Engine.MeshRendererComponent").Properties.size() == 4u',
               'registry.Require("Kairo.Engine.MeshRendererComponent").Properties.size() == 6u'),
              ('registry.Require("Kairo.Engine.LightComponent").Properties.size() == 9u',
               'registry.Require("Kairo.Engine.LightComponent").Properties.size() == 11u')
          ]:
              if old not in text:
                  raise SystemExit(f"RenderingComponentTests anchor not found: {old}")
              text = text.replace(old, new, 1)
          rendering.write_text(text)

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKAIRO_ENGINE_CORE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Commit validated test updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ReflectionV2IntegrationTests.cpp tests/EngineCoreTests.cpp tests/RenderingComponentTests.cpp
          git diff --cached --check
          git commit -m "test: align EngineCore expectations with Reflection V2"
          git push origin HEAD:complete/reflection-v2-integration
