name: Register platform boundary

on:
  push:
    branches:
      - agent/complete-roadmap

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/complete-roadmap
          fetch-depth: 0
      - name: Register platform module and finish direct includes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          platform = Path('Platform.cppm')
          text = platform.read_text()
          if '#include <system_error>\n' not in text:
              text = text.replace('#include <string_view>\n', '#include <string_view>\n#include <system_error>\n', 1)
          platform.write_text(text)

          native = Path('NativeGameplay.cppm')
          text = native.read_text()
          if '#include <cmath>\n' not in text:
              text = text.replace('#include <algorithm>\n', '#include <algorithm>\n#include <cmath>\n', 1)
          native.write_text(text)

          production = Path('ProductionSystems.cppm')
          text = production.read_text()
          if '#include <compare>\n' not in text:
              text = text.replace('#include <cmath>\n', '#include <cmath>\n#include <compare>\n', 1)
          if '#include <string_view>\n' not in text:
              text = text.replace('#include <string>\n', '#include <string>\n#include <string_view>\n', 1)
          production.write_text(text)

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          if 'Platform.cppm' not in text:
              text = text.replace('    TextValidation.cppm TextFormat.cppm ProjectDescriptor.cppm Entity.cppm Components.cppm\n',
                  '    TextValidation.cppm TextFormat.cppm ProjectDescriptor.cppm Platform.cppm Entity.cppm Components.cppm\n', 1)
          if 'tests/PlatformTests.cpp' not in text:
              text = text.replace('        tests/ProductionSystemsTests.cpp)\n',
                  '        tests/ProductionSystemsTests.cpp\n        tests/PlatformTests.cpp)\n', 1)
          cmake.write_text(text)

          umbrella = Path('KairoEngineCore.cppm')
          text = umbrella.read_text()
          if 'export import Kairo.EngineCore.Platform;' not in text:
              text = text.replace('export import Kairo.EngineCore.ProjectDescriptor;\n',
                  'export import Kairo.EngineCore.ProjectDescriptor;\nexport import Kairo.EngineCore.Platform;\n', 1)
          umbrella.write_text(text)

          for candidate in [
              '.github/workflows/register-platform-boundary.yml',
              '.github/workflows/repair-roadmap-modules.yml',
              '.github/workflows/apply-phase3-test-variant-include.yml']:
              path = Path(candidate)
              if path.exists(): path.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Register cross-platform runtime boundary'
          git push origin HEAD:agent/complete-roadmap
