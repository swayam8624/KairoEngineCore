name: Apply EngineCore roadmap portability repair

on:
  push:
    branches:
      - agent/complete-roadmap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/complete-roadmap
          fetch-depth: 0
      - name: Repair EngineCore portability
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path

          p = Path("tests/Phase3RuntimeTests.cpp")
          t = p.read_text()
          if "#include <variant>\n" not in t:
              marker = "#include <utility>\n#include <vector>\n"
              if marker not in t: raise SystemExit("Phase3 include marker missing")
              t = t.replace(marker, "#include <utility>\n#include <variant>\n#include <vector>\n", 1)
          p.write_text(t)

          p = Path("LogicState.cppm")
          t = p.read_text()
          old = "        friend bool operator==(const LogicStateEntry&, const LogicStateEntry&) = default;"
          new = """        friend bool operator==(const LogicStateEntry& left, const LogicStateEntry& right)
                  {
                      if (left.Name != right.Name || left.Value.index() != right.Value.index()) return false;
                      return std::visit([](const auto& a, const auto& b) -> bool {
                          using Left = std::decay_t<decltype(a)>;
                          using Right = std::decay_t<decltype(b)>;
                          if constexpr (!std::is_same_v<Left, Right>) return false;
                          else if constexpr (std::is_same_v<Left, kairo::foundation::math::Vec3d>)
                              return a.x == b.x && a.y == b.y && a.z == b.z;
                          else return a == b;
                      }, left.Value, right.Value);
                  }"""
          if old not in t: raise SystemExit("LogicStateEntry equality marker missing")
          p.write_text(t.replace(old, new, 1))
          PY
          python3 /tmp/patch.py
          rm -f .github/workflows/apply-phase3-test-variant-include.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair EngineCore MSVC module portability'
          git push origin HEAD:agent/complete-roadmap
