name: Apply Phase 3 direct variant include

on:
  push:
    branches:
      - agent/phase3-gameplay-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/phase3-gameplay-runtime
      - name: Add direct standard-library dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/Phase3RuntimeTests.cpp')
          text = path.read_text()
          marker = '#include <utility>\n#include <vector>\n'
          replacement = '#include <utility>\n#include <variant>\n#include <vector>\n'
          if marker not in text:
              raise SystemExit('Phase3 test include marker was not found')
          path.write_text(text.replace(marker, replacement, 1))
          Path('.github/workflows/apply-phase3-test-variant-include.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/Phase3RuntimeTests.cpp .github/workflows/apply-phase3-test-variant-include.yml
          git commit -m 'Import variant directly in Phase 3 tests'
          git push origin HEAD:agent/phase3-gameplay-runtime
