name: Apply deterministic bytecode parser fix

on:
  push:
    branches:
      - agent/phase3-gameplay-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase3-gameplay-runtime
      - name: Patch parser and remove one-shot workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('LogicBytecode.cppm')
          text = path.read_text()
          pattern = re.compile(
              r'        for \(std::uint32_t i = 0; i < vectors; \+\+i\) result\.Vectors\.push_back\(\{\n'
              r'.*?'
              r'        for \(std::uint32_t i = 0; i < entries; \+\+i\) result\.Entries\.push_back\(\{\n'
              r'.*?input\.U32\(\) \}\);',
              re.DOTALL)
          replacement = '''        for (std::uint32_t i = 0; i < vectors; ++i)
          {
              const double x = std::bit_cast<double>(input.U64());
              const double y = std::bit_cast<double>(input.U64());
              const double z = std::bit_cast<double>(input.U64());
              result.Vectors.emplace_back(x, y, z);
          }
          for (std::uint32_t i = 0; i < entities; ++i)
          {
              const std::uint32_t value = input.U32();
              result.Entities.push_back(Entity{ value });
          }
          for (std::uint32_t i = 0; i < instructions; ++i)
          {
              LogicInstruction instruction;
              instruction.Opcode = static_cast<LogicOpcode>(input.U8());
              instruction.A = input.U32();
              instruction.B = input.U32();
              instruction.C = input.U32();
              instruction.D = input.U32();
              result.Instructions.push_back(instruction);
          }
          for (std::uint32_t i = 0; i < entries; ++i)
          {
              LogicEntryPoint entry;
              entry.Event = static_cast<LogicEventKind>(input.U8());
              entry.Action = input.String();
              entry.InstructionOffset = input.U32();
              result.Entries.push_back(std::move(entry));
          }'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one bytecode parser block, found {count}')
          path.write_text(updated)
          Path('.github/workflows/apply-phase3-bytecode-fix.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LogicBytecode.cppm .github/workflows/apply-phase3-bytecode-fix.yml
          git commit -m 'Make logic bytecode reads deterministic'
          git push origin HEAD:agent/phase3-gameplay-runtime
