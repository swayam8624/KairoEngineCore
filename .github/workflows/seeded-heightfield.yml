name: Seeded world heightfield contract
on:
  push:
    branches: [main, feat/deterministic-world-heightcells]
  pull_request:
    paths:
      - 'detail/SeededHeightfield.hpp'
      - 'WorldStreaming.cppm'
      - 'tests/SeededHeightfieldTests.cpp'
      - '.github/workflows/seeded-heightfield.yml'
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and exercise exact seed and seam contracts
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer tests/SeededHeightfieldTests.cpp -o /tmp/seeded-heightfield-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/seeded-heightfield-test
