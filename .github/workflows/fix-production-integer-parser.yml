name: Fix production integer parser
on:
  push:
    branches:
      - agent/phases6-12-runtime
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/phases6-12-runtime
      - run: python3 .github/scripts/fix_production_integer_parser.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix production integer parser after numeric portability pass"
          git push
