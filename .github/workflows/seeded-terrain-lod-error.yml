name: Seeded terrain LOD error contract
on:
  push:
    branches: [main, feat/terrain-lod-error]
  pull_request:
    paths:
      - 'detail/SeededTerrainLodError.hpp'
      - 'detail/SeededTerrainLod.hpp'
      - 'detail/SeededTerrainMesh.hpp'
      - 'detail/SeededHeightfield.hpp'
      - 'WorldStreaming.cppm'
      - 'tests/SeededTerrainLodErrorTests.cpp'
      - '.github/workflows/seeded-terrain-lod-error.yml'
permissions:
  contents: read
jobs:
  error-bound:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify nominal vertical error using integer geometry
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer tests/SeededTerrainLodErrorTests.cpp -o /tmp/terrain-lod-error-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/terrain-lod-error-test
