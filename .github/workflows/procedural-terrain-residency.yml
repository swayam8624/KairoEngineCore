name: Procedural terrain ownership contract
on:
  push:
    branches: [main, feat/procedural-terrain-residency]
  pull_request:
    paths:
      - 'detail/ProceduralTerrainStore.hpp'
      - 'WorldStreaming.cppm'
      - 'tests/ProceduralTerrainStoreTests.cpp'
      - '.github/workflows/procedural-terrain-residency.yml'
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exercise ownership and failure completion under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer tests/ProceduralTerrainStoreTests.cpp -o /tmp/procedural-store-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/procedural-store-test
